# Build the simulator and run the unit tests on every push and pull request.
# The tests use saved API responses, so they don't touch the network.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Render a frame
        # Headless snapshot from saved data: proves the dial draws, not just compiles
        run: >
          ./build/even_flow_sim --config sim/battery.conf --date 2026-10-13 --time 16:40
          --tide tests/data/noaa-tide-8518750-20261012-14.json
          --current tests/data/noaa-current-NYH1927-bin13-20261012-14.json
          --weather tests/data/open-meteo-battery-2026-10-13.json
          --snapshot dial.bmp

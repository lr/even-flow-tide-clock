# Example settings: The Battery, New York Harbor.
#
# The simulator uses this until even-flow.conf exists in the project root
# (gitignored, for your own location). The easiest way to make that file is
# the settings page: python3 tools/dev_server.py, then open localhost:8080.
# Or copy this file and edit it.

place_name=The Battery, NY
latitude=40.700554
longitude=-74.01417
# IANA name for web APIs, and the POSIX rule the clock applies
tz_name=America/New_York
tz_posix=EST5EDT,M3.2.0,M11.1.0

# NOAA tide station. Find others at https://tidesandcurrents.noaa.gov/
station_id=8518750
station_name=The Battery

# NOAA current station and depth bin (the shallowest is what a boat feels).
# Hudson River Entrance is 0.7 nm away; bin 13 is 7 ft down.
current_station_id=NYH1927
current_station_name=Hudson River Entrance
current_bin=13

# Hour at the top of the dial: 12 = noon up, 0 = midnight up
top_hour=12

# Tide heights: ft or m
units=ft

# Weather: f or c, and kn, mph or kmh
temp_unit=f
wind_unit=kn

# Screens in knob order. Leave one out to hide it: tide, current, sun, moon, weather
screens=tide,current,sun,moon,weather

# Example settings for the simulator. To use your own, copy this to
# even-flow.conf in the project root (it's gitignored) and edit it.
#
# The settings web page on the board will fill these in for you: look up a
# place, pick a tide station from the nearest few, done.

place_name=San Francisco, CA
latitude=37.7749
longitude=-122.4194
tz_name=America/Los_Angeles
tz_posix=PST8PDT,M3.2.0,M11.1.0

# NOAA CO-OPS station. Find others at https://tidesandcurrents.noaa.gov/
station_id=9414290
station_name=San Francisco (Golden Gate)

# NOAA current station and depth bin (the shallowest is what a boat feels)
current_station_id=SFB1203
current_station_name=Golden Gate Bridge
current_bin=18

# Hour at the top of the dial: 12 = noon up, 0 = midnight up
top_hour=12

# Tide heights: ft or m
units=ft

# Weather: f or c, and kn, mph or kmh
temp_unit=f
wind_unit=kn

# Screens in knob order. Leave one out to hide it: tide, current, sun, moon, weather
screens=tide,current,sun,moon,weather
